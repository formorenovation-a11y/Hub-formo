<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formo — Calendario</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --black: #191816;
  --panel: #221f1b;
  --panel-line: #34302a;
  --grid-line: rgba(248, 244, 239, 0.05);
  --off-white: #f8f4ef;
  --off-white-dim: #a89f92;
  --gold: #c9a96e;
  --gold-bright: #ddc08a;
  --danger: #b25a44;
  --radius: 2px;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background: var(--black);
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--off-white);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  padding: 36px 20px 60px;
}

.wrap{ max-width: 980px; margin: 0 auto; }

.brand{
  display:flex;
  align-items:center;
  gap: 16px;
  margin-bottom: 30px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--panel-line);
}
.mark{
  width: 44px; height: 44px;
  border: 1.5px solid var(--gold);
  display:flex; align-items:center; justify-content:center;
  font-family:'Playfair Display', serif;
  font-size: 20px;
  color: var(--gold);
  flex-shrink: 0;
}
.wordmark h1{
  font-family:'Playfair Display', serif;
  font-weight: 600;
  font-size: 26px;
  letter-spacing: 0.06em;
  color: var(--off-white);
  line-height: 1;
}
.wordmark .tag{
  font-family:'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-top: 5px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom: 26px;
  flex-wrap: wrap;
  gap: 16px;
}
.title-block .eyebrow{
  font-family:'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 6px;
}
.title-block h2{
  font-family:'Playfair Display', serif;
  font-size: 24px;
  font-weight: 600;
}

.nav{ display:flex; align-items:center; gap: 14px; font-family:'JetBrains Mono', monospace; }
.nav button{
  background: var(--panel);
  border: 1px solid var(--panel-line);
  color: var(--off-white);
  width: 34px; height: 34px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 16px;
  display:flex;align-items:center;justify-content:center;
  transition: border-color .15s, color .15s;
}
.nav button:hover{ border-color: var(--gold); color: var(--gold); }
.nav .month-label{ font-size: 14px; min-width: 150px; text-align:center; color: var(--gold); }

.grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dow{
  font-family:'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--off-white-dim);
  text-align:center;
  padding-bottom: 6px;
}

.day{
  position: relative;
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: var(--radius);
  min-height: 74px;
  padding: 8px;
  cursor: pointer;
  transition: border-color .15s;
  display:flex;
  flex-direction:column;
  justify-content: space-between;
}
.day:hover{ border-color: var(--gold); }
.day.empty{ background: transparent; border: none; cursor: default; }
.day.today{ border-color: var(--gold-bright); }
.day.selected{ border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.day .num{ font-family:'JetBrains Mono', monospace; font-size: 13px; color: var(--off-white-dim); }
.day.today .num{ color: var(--gold-bright); font-weight: 600; }
.day .tick-row{ display:flex; gap: 4px; flex-wrap: wrap; }
.tick{ width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--gold); background: transparent; }
.tick.done{ background: var(--gold); }

.panel{
  margin-top: 28px;
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: var(--radius);
  padding: 22px;
}
.panel .panel-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom: 16px;
  border-bottom: 1px dashed var(--panel-line);
  padding-bottom: 12px;
}
.panel .panel-head h2{ font-family:'Playfair Display', serif; font-size: 19px; font-weight: 600; }
.panel .panel-head .sub{ font-family:'JetBrains Mono', monospace; font-size: 11px; color: var(--off-white-dim); }

.add-row{ display:flex; gap: 8px; margin-bottom: 16px; }
.add-row input{
  flex:1;
  background: var(--black);
  border: 1px solid var(--panel-line);
  color: var(--off-white);
  padding: 10px 12px;
  border-radius: var(--radius);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
}
.add-row input:focus{ outline: none; border-color: var(--gold); }
.add-row button{
  background: var(--gold);
  border: none;
  color: var(--black);
  padding: 0 18px;
  border-radius: var(--radius);
  cursor: pointer;
  font-family: 'Playfair Display', serif;
  font-weight: 600;
  font-size: 13px;
  transition: background .15s;
}
.add-row button:hover{ background: var(--gold-bright); }

.task-list{ display:flex; flex-direction:column; gap: 8px; }
.task{ background: var(--black); border: 1px solid var(--panel-line); border-radius: var(--radius); padding: 10px 12px; }
.task-main{ display:flex; align-items:center; gap: 10px; }
.check{
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1.5px solid var(--off-white-dim);
  cursor: pointer;
  flex-shrink: 0;
  display:flex; align-items:center; justify-content:center;
  transition: border-color .15s;
}
.check:hover{ border-color: var(--gold); }
.task.done > .task-main .check{ background: var(--gold); border-color: var(--gold); }
.task.done > .task-main .check::after{ content:'✓'; font-size: 11px; color: var(--black); }
.task-main .text{ flex:1; font-size: 14px; }
.task.done > .task-main .text{ color: var(--off-white-dim); text-decoration: line-through; }

.progress-chip{
  font-family:'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--gold);
  border: 1px solid var(--panel-line);
  padding: 2px 7px;
  border-radius: 10px;
  flex-shrink: 0;
}
.icon-btn{ background: none; border: none; color: var(--off-white-dim); cursor: pointer; font-size: 14px; padding: 2px 6px; transition: color .15s; flex-shrink: 0; }
.icon-btn:hover{ color: var(--gold); }
.icon-btn.del:hover{ color: var(--danger); }

.subtasks{
  margin: 10px 0 2px 28px;
  padding-left: 14px;
  border-left: 1px dashed var(--panel-line);
  display:flex;
  flex-direction:column;
  gap: 7px;
}
.subtask{ display:flex; align-items:center; gap: 9px; }
.subtask .check{ width: 15px; height: 15px; }
.subtask.done .check{ background: var(--gold); border-color: var(--gold); }
.subtask.done .check::after{ content:'✓'; font-size: 9px; color: var(--black); }
.subtask .text{ flex:1; font-size: 13px; color: var(--off-white); }
.subtask.done .text{ color: var(--off-white-dim); text-decoration: line-through; }

.sub-add-row{ display:flex; gap: 8px; margin-top: 4px; }
.sub-add-row input{
  flex:1;
  background: var(--panel);
  border: 1px solid var(--panel-line);
  color: var(--off-white);
  padding: 7px 10px;
  border-radius: var(--radius);
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
}
.sub-add-row input:focus{ outline: none; border-color: var(--gold); }
.sub-add-row button{
  background: none;
  border: 1px solid var(--panel-line);
  color: var(--gold);
  padding: 0 12px;
  border-radius: var(--radius);
  cursor: pointer;
  font-family:'JetBrains Mono', monospace;
  font-size: 11px;
}
.sub-add-row button:hover{ border-color: var(--gold); }

.empty-state{ font-family:'JetBrains Mono', monospace; font-size: 12px; color: var(--off-white-dim); padding: 10px 2px; }
.status-line{ font-family:'JetBrains Mono', monospace; font-size: 10px; color: var(--off-white-dim); margin-top: 18px; text-align: center; opacity: 0.6; }
.status-line.err{ color: var(--danger); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="mark">F</div>
    <div class="wordmark">
      <h1>FORMO</h1>
      <div class="tag">Renovation · Nashville</div>
    </div>
  </div>

  <header>
    <div class="title-block">
      <div class="eyebrow">Planificador de equipo</div>
      <h2>Calendario de tareas</h2>
    </div>
    <div class="nav">
      <button id="prevBtn">‹</button>
      <div class="month-label" id="monthLabel">—</div>
      <button id="nextBtn">›</button>
    </div>
  </header>

  <div class="grid" id="dowRow"></div>
  <div class="grid" id="calGrid" style="margin-top:6px;"></div>

  <div class="panel">
    <div class="panel-head">
      <h2 id="selectedDateLabel">Selecciona un día</h2>
      <div class="sub" id="selectedDateSub"></div>
    </div>
    <div class="add-row">
      <input type="text" id="taskInput" placeholder="Agregar tarea para este día..." />
      <button id="addBtn">Agregar</button>
    </div>
    <div class="task-list" id="taskList"></div>
  </div>

  <div class="status-line" id="statusLine">conectando...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, doc, onSnapshot, setDoc
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAV3Cu4wfb5iRoz0wA8leoGSfRUX7UMnsQ",
  authDomain: "formo-renovation-aa189.firebaseapp.com",
  projectId: "formo-renovation-aa189",
  storageBucket: "formo-renovation-aa189.firebasestorage.app",
  messagingSenderId: "98854002850",
  appId: "1:98854002850:web:e2b65b2d9f014c602737fb",
  measurementId: "G-GCEZZ6G8L7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const tasksCol = collection(db, "calendarTasks");

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DOW = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

let allTasks = {}; // { 'YYYY-MM-DD': { tasks: [...] } }
let current = new Date();
current.setDate(1);
let selectedDate = fmtDate(new Date());
let openSubtaskForms = new Set();

function fmtDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return fmtDate(new Date()); }

function getTasksFor(dateStr){
  return (allTasks[dateStr] && allTasks[dateStr].tasks) || [];
}

async function saveTasksFor(dateStr, tasks){
  try{
    await setDoc(doc(tasksCol, dateStr), { tasks });
    setStatus('sincronizado con el equipo', false);
  }catch(e){
    setStatus('error al guardar — revisa tu conexión', true);
  }
}

function setStatus(text, isErr){
  const el = document.getElementById('statusLine');
  el.textContent = text;
  el.classList.toggle('err', !!isErr);
}

// Real-time listener — every team member sees changes instantly
onSnapshot(tasksCol, (snapshot) => {
  const next = {};
  snapshot.forEach(docSnap => { next[docSnap.id] = docSnap.data(); });
  allTasks = next;
  renderCalendar();
  renderPanel();
  setStatus('sincronizado con el equipo', false);
}, (err) => {
  setStatus('sin conexión con Firebase — revisa la configuración', true);
});

function renderDow(){
  document.getElementById('dowRow').innerHTML = DOW.map(d => `<div class="dow">${d}</div>`).join('');
}

function renderCalendar(){
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  document.getElementById('monthLabel').textContent = `${MESES[current.getMonth()]} ${current.getFullYear()}`;

  const year = current.getFullYear();
  const month = current.getMonth();
  const firstDay = new Date(year, month, 1);
  let startOffset = firstDay.getDay() - 1;
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(year, month+1, 0).getDate();

  for(let i=0; i<startOffset; i++){
    const empty = document.createElement('div');
    empty.className = 'day empty';
    grid.appendChild(empty);
  }

  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const dstr = fmtDate(dateObj);
    const cell = document.createElement('div');
    cell.className = 'day';
    if(dstr === todayStr()) cell.classList.add('today');
    if(dstr === selectedDate) cell.classList.add('selected');

    const tasks = getTasksFor(dstr);
    let ticksHtml = '<div></div>';
    if(tasks.length){
      ticksHtml = '<div class="tick-row">' + tasks.slice(0,6).map(t => `<div class="tick ${t.done ? 'done':''}"></div>`).join('') + '</div>';
    }

    cell.innerHTML = `<div class="num">${d}</div>${ticksHtml}`;
    cell.addEventListener('click', () => {
      selectedDate = dstr;
      renderCalendar();
      renderPanel();
    });
    grid.appendChild(cell);
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderPanel(){
  const [y,m,d] = selectedDate.split('-').map(Number);
  const dateObj = new Date(y, m-1, d);
  const weekday = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][dateObj.getDay()];
  document.getElementById('selectedDateLabel').textContent = `${weekday} ${d} de ${MESES[m-1]}`;
  document.getElementById('selectedDateSub').textContent = selectedDate;

  const tasks = getTasksFor(selectedDate);
  const list = document.getElementById('taskList');

  if(tasks.length === 0){
    list.innerHTML = '<div class="empty-state">Sin tareas para este día todavía.</div>';
    return;
  }

  list.innerHTML = tasks.map(t => {
    const subtasks = t.subtasks || [];
    const doneCount = subtasks.filter(s => s.done).length;
    const chip = subtasks.length ? `<div class="progress-chip">${doneCount}/${subtasks.length}</div>` : '';
    const subtasksHtml = subtasks.map(s => `
      <div class="subtask ${s.done ? 'done':''}" data-sub-id="${s.id}">
        <div class="check"></div>
        <div class="text">${escapeHtml(s.text)}</div>
        <button class="icon-btn del" data-sub-del="${s.id}">✕</button>
      </div>
    `).join('');
    const showForm = openSubtaskForms.has(t.id);
    return `
      <div class="task ${t.done ? 'done':''}" data-id="${t.id}">
        <div class="task-main">
          <div class="check" data-toggle="${t.id}"></div>
          <div class="text">${escapeHtml(t.text)}</div>
          ${chip}
          <button class="icon-btn" data-addsub="${t.id}" title="Agregar subtarea">+</button>
          <button class="icon-btn del" data-del="${t.id}" title="Eliminar tarea">✕</button>
        </div>
        ${(subtasks.length || showForm) ? `
          <div class="subtasks">
            ${subtasksHtml}
            ${showForm ? `
              <div class="sub-add-row">
                <input type="text" placeholder="Subtarea..." data-subinput="${t.id}" />
                <button data-subsubmit="${t.id}">Agregar</button>
              </div>
            ` : ''}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');

  list.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => toggleTask(el.getAttribute('data-toggle')));
  });
  list.querySelectorAll('[data-del]').forEach(el => {
    el.addEventListener('click', () => deleteTask(el.getAttribute('data-del')));
  });
  list.querySelectorAll('[data-addsub]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-addsub');
      if(openSubtaskForms.has(id)) openSubtaskForms.delete(id);
      else openSubtaskForms.add(id);
      renderPanel();
      const input = list.querySelector(`[data-subinput="${id}"]`);
      if(input) input.focus();
    });
  });
  list.querySelectorAll('[data-sub-id]').forEach(el => {
    const subId = el.getAttribute('data-sub-id');
    el.querySelector('.check').addEventListener('click', () => {
      const taskId = el.closest('.task').getAttribute('data-id');
      toggleSubtask(taskId, subId);
    });
  });
  list.querySelectorAll('[data-sub-del]').forEach(el => {
    const subId = el.getAttribute('data-sub-del');
    el.addEventListener('click', () => {
      const taskId = el.closest('.task').getAttribute('data-id');
      deleteSubtask(taskId, subId);
    });
  });
  list.querySelectorAll('[data-subsubmit]').forEach(el => {
    const taskId = el.getAttribute('data-subsubmit');
    const submit = () => addSubtask(taskId);
    el.addEventListener('click', submit);
    const input = list.querySelector(`[data-subinput="${taskId}"]`);
    if(input) input.addEventListener('keydown', (e) => { if(e.key === 'Enter') submit(); });
  });
}

async function addTask(){
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if(!text) return;
  const tasks = getTasksFor(selectedDate).slice();
  tasks.push({ id: Date.now().toString(36), text, done: false, subtasks: [] });
  input.value = '';
  await saveTasksFor(selectedDate, tasks);
}

async function toggleTask(id){
  const tasks = getTasksFor(selectedDate).map(t => t.id === id ? { ...t, done: !t.done } : t);
  await saveTasksFor(selectedDate, tasks);
}

async function deleteTask(id){
  const tasks = getTasksFor(selectedDate).filter(t => t.id !== id);
  openSubtaskForms.delete(id);
  await saveTasksFor(selectedDate, tasks);
}

async function addSubtask(taskId){
  const input = document.querySelector(`[data-subinput="${taskId}"]`);
  const text = input.value.trim();
  if(!text) return;
  const tasks = getTasksFor(selectedDate).map(t => {
    if(t.id !== taskId) return t;
    const subtasks = (t.subtasks || []).concat([{ id: Date.now().toString(36), text, done: false }]);
    return { ...t, subtasks };
  });
  openSubtaskForms.delete(taskId);
  await saveTasksFor(selectedDate, tasks);
}

async function toggleSubtask(taskId, subId){
  const tasks = getTasksFor(selectedDate).map(t => {
    if(t.id !== taskId) return t;
    const subtasks = (t.subtasks || []).map(s => s.id === subId ? { ...s, done: !s.done } : s);
    return { ...t, subtasks };
  });
  await saveTasksFor(selectedDate, tasks);
}

async function deleteSubtask(taskId, subId){
  const tasks = getTasksFor(selectedDate).map(t => {
    if(t.id !== taskId) return t;
    const subtasks = (t.subtasks || []).filter(s => s.id !== subId);
    return { ...t, subtasks };
  });
  await saveTasksFor(selectedDate, tasks);
}

document.getElementById('prevBtn').addEventListener('click', () => { current.setMonth(current.getMonth() - 1); renderCalendar(); });
document.getElementById('nextBtn').addEventListener('click', () => { current.setMonth(current.getMonth() + 1); renderCalendar(); });
document.getElementById('addBtn').addEventListener('click', addTask);
document.getElementById('taskInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') addTask(); });

renderDow();
renderCalendar();
renderPanel();
</script>
</body>
</html>
